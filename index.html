<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MAJOR VIEWBOT CLIPS KICK</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    min-height: 100vh;
    display: flex; align-items: center; justify-content: center;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff;
  }
  .card {
    background: rgba(255,255,255,0.06);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 35px 30px;
    width: 460px; max-width: 94vw;
    text-align: center;
    box-shadow: 0 15px 45px rgba(0,0,0,0.5);
  }
  .logo {
    width: 110px; height: 110px;
    border-radius: 50%; object-fit: cover;
    border: 3px solid rgba(255,255,255,0.25);
    margin-bottom: 15px;
    box-shadow: 0 0 25px rgba(114,137,218,0.6);
  }
  h1 { font-size: 21px; margin-bottom: 5px; }
  p.sub { color: #b9b9d6; font-size: 13px; margin-bottom: 20px; }
  .field { position: relative; }
  input[type="text"] {
    width: 100%; padding: 13px 16px;
    border-radius: 12px;
    border: 2px solid rgba(255,255,255,0.2);
    background: rgba(0,0,0,0.35); color: #fff;
    font-size: 15px; text-align: center; letter-spacing: 1px;
    outline: none; transition: border-color .3s; direction: ltr;
  }
  input[type="text"]:focus { border-color: #7289da; }
  .dropdown {
     display:none !important;
    display: none; position: absolute; z-index: 10;
    top: calc(100% + 6px); left: 0; right: 0;
    max-height: 220px; overflow-y: auto;
    background: #1b1b33; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px; text-align: left; direction: ltr;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  .dropdown .item {
    padding: 10px 14px; cursor: pointer;
    font-size: 13px; color: #cfd3ff;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    transition: background .15s;
  }
  .dropdown .item:hover { background: #2c2c52; color: #fff; }
  .dropdown .empty { padding: 12px; color: #888; font-size: 13px; text-align: center; }
  .hint { font-size: 12px; color: #8a8ab0; margin-top: 10px; }
  button {
    width: 100%; margin-top: 14px; padding: 13px;
    border: none; border-radius: 12px;
    background: linear-gradient(135deg, #7289da, #5865f2);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: transform .2s, opacity .2s;
  }
  button:hover { transform: translateY(-2px); opacity: .9; }
  button:disabled { opacity: .5; cursor: not-allowed; transform: none; }
  #msg { margin-top: 13px; font-size: 14px; min-height: 20px; }
  .ok  { color: #57f287; }
  .err { color: #ed4245; }
  .warn { color: #fee75c; }
  .loading { color: #b9b9d6; font-size: 13px; margin-top: 12px; }

/* ===== MAJOR VIEWBOT CLIPS KICK — animated theme ===== */
html,body{min-height:100%;overflow-x:hidden}
body{
  position:relative!important;
  isolation:isolate;
  flex-direction:column!important;
  gap:22px;
  padding:30px 15px;
  background:#05060b!important;
}
body::before{
  content:"";
  position:fixed;
  inset:-25%;
  z-index:-5;
  pointer-events:none;
  background:
    radial-gradient(circle at 15% 25%,rgba(0,255,170,.20),transparent 26%),
    radial-gradient(circle at 85% 18%,rgba(88,101,242,.23),transparent 28%),
    radial-gradient(circle at 75% 85%,rgba(168,85,247,.18),transparent 28%),
    linear-gradient(125deg,#02030a,#0a1120 48%,#09030f);
  background-size:145% 145%;
  animation:majorGradient 14s ease-in-out infinite alternate;
}
body::after{
  content:"";
  position:fixed;
  inset:0;
  z-index:-4;
  pointer-events:none;
  opacity:.18;
  background-image:
    linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),
    linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:46px 46px;
  transform:perspective(520px) rotateX(55deg) scale(1.8) translateY(17%);
  transform-origin:center bottom;
  animation:majorGrid 10s linear infinite;
}
.major-bg{
  position:fixed;
  inset:0;
  z-index:-3;
  overflow:hidden;
  pointer-events:none;
}
.major-orb{
  position:absolute;
  width:300px;height:300px;
  border-radius:50%;
  filter:blur(65px);
  opacity:.16;
  animation:majorOrb 11s ease-in-out infinite alternate;
}
.major-orb:nth-child(1){left:-100px;top:10%;background:#00ffa6}
.major-orb:nth-child(2){right:-110px;top:8%;background:#5865f2;animation-delay:-3s}
.major-orb:nth-child(3){right:15%;bottom:-120px;background:#a855f7;animation-delay:-6s}

.major-brand{
  position:relative;
  z-index:3;
  width:100%;
  text-align:center;
  direction:ltr;
  user-select:none;
  pointer-events:none;
}
.major-brand .major-name{
  display:inline-block;
  font-family:Impact,"Arial Black",sans-serif;
  font-size:clamp(30px,5vw,62px);
  font-weight:900;
  letter-spacing:4px;
  line-height:1;
  background:linear-gradient(90deg,#fff,#70ffd2,#7289ff,#d7b7ff,#fff);
  background-size:300% auto;
  -webkit-background-clip:text;
  background-clip:text;
  color:transparent;
  text-shadow:0 0 28px rgba(0,255,190,.18);
  animation:majorShine 4s linear infinite,majorFloat 3s ease-in-out infinite;
}
.major-brand .major-sub{
  display:block;
  margin-top:9px;
  color:rgba(255,255,255,.78);
  font:800 clamp(11px,1.7vw,16px)/1.2 "Segoe UI",sans-serif;
  letter-spacing:5px;
  text-transform:uppercase;
}
.major-brand::after{
  content:"";
  display:block;
  width:min(480px,75vw);
  height:2px;
  margin:12px auto 0;
  background:linear-gradient(90deg,transparent,#00ffa6,#7289ff,#a855f7,transparent);
  box-shadow:0 0 18px rgba(0,255,166,.55);
  animation:majorPulse 2s ease-in-out infinite;
}
@keyframes majorGradient{
  from{transform:translate3d(-2%,-2%,0) scale(1)}
  to{transform:translate3d(2%,2%,0) scale(1.08)}
}
@keyframes majorGrid{
  from{background-position:0 0,0 0}
  to{background-position:0 46px,46px 0}
}
@keyframes majorOrb{
  from{transform:translate(0,0) scale(.82)}
  to{transform:translate(90px,-55px) scale(1.25)}
}
@keyframes majorShine{to{background-position:300% center}}
@keyframes majorFloat{50%{transform:translateY(-4px)}}
@keyframes majorPulse{50%{opacity:.45;transform:scaleX(.75)}}

.major-panel-glow{
  box-shadow:0 0 0 1px rgba(255,255,255,.05),
             0 18px 55px rgba(0,0,0,.35),
             0 0 35px rgba(0,255,166,.045);
}

@media (prefers-reduced-motion:reduce){
  body::before,body::after,.major-orb,
  .major-brand .major-name,.major-brand::after{animation:none!important}
}

/* Always-visible login button */
#btn{
  display:block!important;
  visibility:visible!important;
  opacity:1!important;
  background:linear-gradient(135deg,#00d084,#5865f2)!important;
  box-shadow:0 0 22px rgba(0,208,132,.25);
}
#btn:hover{
  transform:translateY(-2px) scale(1.01);
  box-shadow:0 0 30px rgba(0,208,132,.38);
}

  .socials{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin-top:12px;
  }
  .socials a{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:42px;
    padding:8px 6px;
    border:1px solid rgba(255,255,255,.12);
    border-radius:10px;
    background:rgba(255,255,255,.05);
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:700;
    transition:.2s;
  }
  .socials a:hover{
    transform:translateY(-2px);
    background:rgba(255,255,255,.10);
    border-color:rgba(255,255,255,.25);
  }
  @media (max-width:520px){
    .socials{grid-template-columns:repeat(2,1fr);}
  }


  .socials a{
    position:relative;
    overflow:hidden;
    isolation:isolate;
    animation:socialFloat 3s ease-in-out infinite;
    background:linear-gradient(120deg,rgba(0,255,166,.10),rgba(88,101,242,.12),rgba(168,85,247,.12),rgba(255,255,255,.06));
    background-size:300% 300%;
    animation:socialColors 5s ease infinite, socialFloat 3s ease-in-out infinite;
    box-shadow:0 0 12px rgba(0,255,166,.10);
  }
  .socials a::before{
    content:"";
    position:absolute;
    inset:-2px;
    z-index:-1;
    border-radius:12px;
    background:linear-gradient(90deg,#00ffa6,#5865f2,#a855f7,#ff4fd8,#00ffa6);
    background-size:300% 100%;
    animation:socialBorder 4s linear infinite;
    opacity:.75;
  }
  .socials a::after{
    content:"";
    position:absolute;
    top:-60%;
    left:-35%;
    width:35%;
    height:220%;
    transform:rotate(25deg);
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
    animation:socialShine 2.8s ease-in-out infinite;
    pointer-events:none;
  }
  .socials a:hover{
    transform:translateY(-4px) scale(1.03);
    box-shadow:0 0 24px rgba(0,255,166,.28),0 0 35px rgba(88,101,242,.20);
  }
  .social-discord{animation-delay:0s!important}
  .social-tiktok{animation-delay:.25s!important}
  .social-facebook{animation-delay:.5s!important}
  .social-whatsapp{animation-delay:.75s!important}

  @keyframes socialColors{
    0%,100%{background-position:0% 50%}
    50%{background-position:100% 50%}
  }
  @keyframes socialBorder{
    to{background-position:300% 0}
  }
  @keyframes socialShine{
    0%{left:-45%;opacity:0}
    20%{opacity:1}
    55%{left:120%;opacity:0}
    100%{left:120%;opacity:0}
  }
  @keyframes socialFloat{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-2px)}
  }

</style>

  <h1>login dashboard</h1>
  <p class="sub">أدخل مفتاح الوصول للدخول</p>
  <p style="color:#8f8fba;font-size:12px;margin-top:-12px;margin-bottom:18px;">major am 360</p>

  <div class="field">
    <input type="text" id="keyInput" placeholder="key: MAJOR-XXXXX-XXXXX" autocomplete="off">
    <div class="dropdown" id="dropdown"></div>
  </div>
  <p class="hint">تواصل مع الأدمن لشراء المفتاح</p>

  <div class="socials" aria-label="روابط التواصل">
    <a class="social-discord" href="https://discord.gg/WrK7ttvq5g" target="_blank" rel="noopener">💬 Discord</a>
    <a class="social-tiktok" href="https://www.tiktok.com/@major.am360" target="_blank" rel="noopener">🎵 TikTok</a>
    <a class="social-facebook" href="https://www.facebook.com/ange911/" target="_blank" rel="noopener">📘 Facebook</a>
    <a class="social-whatsapp" href="https://wa.me/213552249306" target="_blank" rel="noopener">📱 WhatsApp</a>
  </div>

  <button id="btn" onclick="enterDashboard()">🔐 تسجيل الدخول</button>
  <div id="msg"></div>
</div>

<script>
// ── مصدر المفاتيح ──────────────────────────────
const KEYS_URL = "https://raw.githubusercontent.com/majordz6931/key-clips-web-/refs/heads/main/user_agents_formatted.txt";

// نسخة احتياطية مدمجة (تُستخدم فقط إذا فشل الاتصال بـ GitHub)
const FALLBACK_KEYS = ``;

// ── الحالة ────────────────────────────────────
let validKeys = [];

const input    = document.getElementById("keyInput");
const dropdown = document.getElementById("dropdown");
const btn      = document.getElementById("btn");
const msg      = document.getElementById("msg");

function setMsg(text, cls) {
  msg.className = cls || "";
  msg.textContent = text;
}

function parseKeys(text) {
  // كل سطر = مفتاح: نحيدو الفراغات، الأسطر الفارغة، والمكرر
  return [...new Set(
    text.split("\n").map(s => s.trim()).filter(s => s.length > 0)
  )];
}

// ── جلب المفاتيح من GitHub ────────────────────
async function loadKeys() {
  try {
    const res = await fetch(KEYS_URL);
    if (!res.ok) throw new Error("HTTP " + res.status);
    const text = await res.text();
    validKeys = parseKeys(text);
    if (validKeys.length === 0) throw new Error("الملف فارغ");
    setMsg("تم تحميل " + validKeys.length + " مفتاح من الخادم", "ok");
  } catch (e) {
    validKeys = parseKeys(FALLBACK_KEYS);
    setMsg("تعذر الاتصال بـ GitHub — استُعملت النسخة المحلية", "warn");
  }
  renderList(validKeys);
  checkInput();
}

// ── القائمة المنسدلة ──────────────────────────
function renderList(list) {
  if (list.length === 0) {
    dropdown.innerHTML = '<div class="empty">لا توجد مفاتيح</div>';
    dropdown.style.display = "block";
    return;
  }
  dropdown.innerHTML = "";
  list.forEach(key => {
    const div = document.createElement("div");
    div.className = "item";
    div.textContent = key;
    div.onclick = () => {
      input.value = key;
      dropdown.style.display = "none";
      checkInput();
    };
    dropdown.appendChild(div);
  });
  dropdown.style.display = "block";
}

function filterList() {
  const q = input.value.trim().toLowerCase();
  const filtered = q
    ? validKeys.filter(k => k.toLowerCase().includes(q))
    : validKeys;
  renderList(filtered);
}

// ── التحقق المباشر من الإدخال ─────────────────
function checkInput() {
  const key = input.value.trim();
  const valid = validKeys.includes(key);   // مقارنة حساسة للحالة (case-sensitive)
  btn.disabled = false;
  if (key && !valid) {
    setMsg("✕ هذا المفتاح غير موجود في القائمة", "err");
  } else {
    setMsg("");
  }
  return valid;
}

// ── الدخول ────────────────────────────────────
function enterDashboard() {
  const key = input.value.trim();
  if (!validKeys.includes(key)) { setMsg("✕ مفتاح غير صالح", "err"); return; }

  // نحفظو المفتاح في الجلسة باش الداشبورد يتأكد منو
  sessionStorage.setItem("auth_key", key);

  setMsg("✓ مفتاح صحيح! جارٍ فتح الداشبورد...", "ok");
  btn.disabled = true;
  setTimeout(() => { window.location.href = "dashboard.html"; }, 1000);
}

// ── الأحداث ───────────────────────────────────
input.addEventListener("input", filterList);
// تم إخفاء قائمة المفاتيح عند الضغط على الحقل
input.addEventListener("blur", () => {
  setTimeout(() => { dropdown.style.display = "none"; }, 200);
});
input.addEventListener("keydown", (e) => {
  if (e.key === "Enter") {
    if (checkInput()) enterDashboard();
  }
});

// تشغيل
loadKeys();
</script>
